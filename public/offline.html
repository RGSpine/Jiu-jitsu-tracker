<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Tatame offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #111;
        font-family: sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      main { max-width: 24rem; padding: 24px; }
      h1 { font-size: 2rem; margin: 0 0 0.4rem; }
      button {
        margin-top: 16px;
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        background: #c8102e;
        color: #fff;
        font-weight: 700;
        padding: 0 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>O Tatame precisa da rede para abrir os treinos.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
